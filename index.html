<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#315d33" />
  <meta name="description" content="Finance Mastery v2.0 — deep TCH 302 theory, readable cash-flow timelines, guided worked examples and 600-question practice." />
  <title>Finance Mastery v2.0 — TCH 302</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-meta shell">
      <span>● TCH 302 · Principles of Finance</span>
      <span class="header-meta-right">Source-aligned study system · Local-first</span>
    </div>
    <div class="nav-shell shell">
      <a class="brand" href="#dashboard" aria-label="Finance Mastery home">
        <span class="brand-mark">FM</span>
        <span class="brand-copy"><strong>FINANCE</strong><small>MASTERY</small></span>
      </a>
      <nav class="top-nav" id="topNav" aria-label="Primary navigation">
        <a href="#dashboard">Home</a>
        <a href="#learn">Learn</a>
        <a href="#practice">Practice</a>
        <a href="#exam">Exam</a>
        <a href="#formulas">Formulas</a>
      </nav>
      <div class="nav-actions">
        <button class="search-trigger" id="searchTrigger" aria-label="Search">⌕</button>
        <button class="primary-pill" data-route="practice">Start practice ↗</button>
        <button class="menu-trigger" id="menuTrigger" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="annotationToolbar" class="annotation-toolbar" hidden>
    <button data-anno="highlight" data-color="yellow" title="Yellow highlight">● Yellow</button><button data-anno="highlight" data-color="green" title="Green highlight">● Green</button><button data-anno="highlight" data-color="pink" title="Pink highlight">● Pink</button><button data-anno="highlight" data-color="blue" title="Blue highlight">● Blue</button>
    <button data-anno="comment">Comment</button>
    <button data-anno="flashcard">Flashcard</button>
  </div>


  <dialog id="noteDialog" class="note-dialog">
    <form method="dialog" class="note-dialog-card" id="noteForm">
      <div class="note-dialog-head">
        <div>
          <span class="eyebrow">STUDY NOTE</span>
          <h2 id="noteDialogTitle">Add note</h2>
        </div>
        <button type="button" class="icon-close" data-note-close aria-label="Close note editor">×</button>
      </div>
      <div class="note-quote-preview">
        <span>Selected passage</span>
        <blockquote id="noteQuotePreview"></blockquote>
      </div>
      <label class="note-field">
        <span>Your note</span>
        <textarea id="noteText" rows="6" maxlength="1600" placeholder="Write the reason, shortcut, warning, or connection you want to remember…"></textarea>
      </label>
      <div class="note-dialog-options">
        <label><span>Highlight color</span><select id="noteColor"><option value="yellow">Yellow</option><option value="green">Green</option><option value="pink">Pink</option><option value="blue">Blue</option></select></label>
        <label class="note-check"><input id="noteHighlight" type="checkbox" checked><span>Highlight this passage in the lesson</span></label>
      </div>
      <div class="note-dialog-actions">
        <button type="button" class="text-btn" data-note-close>Cancel</button>
        <button type="submit" class="green-btn" id="saveNoteBtn">Save note</button>
      </div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="study-content.js"></script>
  <script src="deep-content-core.js"></script>
  <script src="deep-intro.js"></script>
  <script src="deep-tvm.js"></script>
  <script src="deep-personal.js"></script>
  <script src="deep-markets.js"></script>
  <script src="deep-valuation.js"></script>
  <script src="deep-risk.js"></script>
  <script src="deep-health.js"></script>
  <script src="annotations.js"></script>
  <script src="app.js"></script>
</body>
</html>
